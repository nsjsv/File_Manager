name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.0.1"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  APP_NAME: file-manager
  CARGO_PACKAGE: app-ui
  CARGO_BINARY: app-ui
  ARCH: x86_64

jobs:
  linux-release:
    name: Build Linux release
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib \
            cargo \
            fontconfig \
            git \
            libxkbcommon \
            pkgconf \
            rust \
            wayland

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must look like v0.0.1"
            exit 1
          fi

          semver="${version#v}"
          package_dir="${APP_NAME}-${version}-${ARCH}"
          asset_name="${package_dir}.tar.gz"

          {
            echo "version=${version}"
            echo "semver=${semver}"
            echo "package_dir=${package_dir}"
            echo "asset_name=${asset_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Cargo package version
        run: |
          package_id="$(cargo pkgid -p "${CARGO_PACKAGE}")"
          package_version="${package_id##*#}"
          if [[ "${package_version}" == "${package_id}" ]]; then
            package_version="${package_id##*@}"
          fi
          if [[ "${package_version}" != "${{ steps.metadata.outputs.semver }}" ]]; then
            echo "::error::${CARGO_PACKAGE} version ${package_version} does not match release ${{ steps.metadata.outputs.version }}"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked -p "${CARGO_PACKAGE}"

      - name: Package release archive
        run: |
          package_dir="${{ steps.metadata.outputs.package_dir }}"
          asset_name="${{ steps.metadata.outputs.asset_name }}"
          payload="dist/${package_dir}"

          install -Dm755 "target/release/${CARGO_BINARY}" "${payload}/usr/bin/${APP_NAME}"
          install -Dm644 LICENSE "${payload}/usr/share/licenses/${APP_NAME}/LICENSE"

          install -dm755 "${payload}/usr/share/applications"
          cat > "${payload}/usr/share/applications/${APP_NAME}.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=File Manager
          Exec=file-manager
          Categories=System;FileManager;
          Terminal=false
          EOF

          tar -C dist -czf "${asset_name}" "${package_dir}"
          sha256sum "${asset_name}" > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: File Manager ${{ steps.metadata.outputs.version }}
          files: |
            ${{ steps.metadata.outputs.asset_name }}
            SHA256SUMS
